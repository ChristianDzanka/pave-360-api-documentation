name: Deploy Pave 360 Documentation to S3

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env: #
      VITE_MODE: ${{ secrets.VITE_MODE }}
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      VITE_TOKEN_SECRET: ${{ secrets.VITE_TOKEN_SECRET }}
      VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Set environment based on branch
        id: envselect
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "bucket=${{ secrets.AWS_APP_PAVE360_BUCKET }}" >> $GITHUB_OUTPUT
            echo "access_key=${{ secrets.AWS_APP_PAVE360_ACCESS_KEY }}" >> $GITHUB_OUTPUT
            echo "secret_key=${{ secrets.AWS_APP_PAVE360_SECRET }}" >> $GITHUB_OUTPUT
            echo "region=${{ secrets.AWS_APP_PAVE360_REGION }}" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "bucket=${{ secrets.AWS_APP_PAVE360_BUCKET_DEV }}" >> $GITHUB_OUTPUT
            echo "access_key=${{ secrets.AWS_APP_PAVE360_ACCESS_KEY }}" >> $GITHUB_OUTPUT
            echo "secret_key=${{ secrets.AWS_APP_PAVE360_SECRET }}" >> $GITHUB_OUTPUT
            echo "region=${{ secrets.AWS_APP_PAVE360_REGION }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to AWS S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_APP_PAVE360_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_APP_PAVE360_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_APP_PAVE360_SECRET }}
          AWS_REGION: ${{ secrets.AWS_APP_PAVE360_REGION }}
          SOURCE_DIR: dist

      - name: Post-deploy note
        if: success()
        run: |
          echo "✅ Deployed to ${{ github.ref_name }} (Bucket: ${{ secrets.AWS_APP_PAVE360_BUCKET }})"

      - name: Deployment summary
        run: |
          echo "✅ Deployed to ${{ steps.envselect.outputs.env }} environment (Bucket: ${{ steps.envselect.outputs.bucket }})"
